<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>CYBER NEON MAHJONG SCORE MANAGER</title>
  <style>
    :root {
      --bg-color: #030508;
      --card-bg: #0a0e17;
      --panel-bg: #101726;
      --neon-cyan: #00f3ff;
      --neon-pink: #ff0055;
      --neon-green: #00ff66;
      --neon-yellow: #ffe600;
      --neon-purple: #b026ff;
      --text-color: #ffffff;
      --text-dim: #5c6b80;
      --border-color: #1a2638;
    }

    * {
      box-sizing: border-box;
      user-select: none;
    }

    body {
      font-family: 'Segoe UI', 'Hiragino Kaku Gothic ProN', sans-serif;
      background-color: var(--bg-color);
      color: var(--text-color);
      margin: 0;
      padding: 16px;
      display: flex;
      flex-direction: column;
      align-items: center;
      min-height: 100vh;
      background-image: 
        radial-gradient(circle at 50% 0%, rgba(0, 243, 255, 0.08) 0%, transparent 60%),
        radial-gradient(circle at 100% 100%, rgba(255, 0, 85, 0.05) 0%, transparent 50%);
    }

    .app-container {
      width: 100%;
      max-width: 900px;
    }

    /* ネオンヘッダー */
    header h1 {
      text-align: center;
      color: #fff;
      font-size: 1.8rem;
      margin-bottom: 24px;
      letter-spacing: 4px;
      text-transform: uppercase;
      text-shadow:
        0 0 5px #fff,
        0 0 10px #fff,
        0 0 20px var(--neon-cyan),
        0 0 40px var(--neon-cyan),
        0 0 80px var(--neon-cyan);
    }

    /* 強烈なネオンタブ切り替え */
    .tab-menu {
      display: flex;
      gap: 12px;
      margin-bottom: 24px;
      border-bottom: 2px solid var(--border-color);
      padding-bottom: 12px;
    }

    .tab-btn {
      flex: 1;
      background: var(--card-bg);
      border: 1px solid var(--border-color);
      color: var(--text-dim);
      padding: 14px 8px;
      border-radius: 8px;
      cursor: pointer;
      font-weight: bold;
      font-size: 0.95rem;
      letter-spacing: 1px;
      transition: all 0.3s ease;
      text-align: center;
    }

    .tab-btn.active {
      background: var(--panel-bg);
      color: var(--neon-cyan);
      border-color: var(--neon-cyan);
      box-shadow:
        0 0 10px rgba(0, 243, 255, 0.4),
        inset 0 0 15px rgba(0, 243, 255, 0.2);
      text-shadow: 0 0 8px var(--neon-cyan);
    }

    /* タブコンテンツ */
    .tab-content {
      display: none;
    }

    .tab-content.active {
      display: block;
    }

    /* ネオンカードフレーム */
    .card {
      background: var(--card-bg);
      border: 1px solid var(--border-color);
      border-radius: 12px;
      padding: 24px;
      margin-bottom: 24px;
      box-shadow: 
        0 8px 32px rgba(0, 0, 0, 0.8),
        0 0 1px rgba(0, 243, 255, 0.2);
      position: relative;
      overflow: hidden;
    }

    .card::before {
      content: '';
      position: absolute;
      top: 0; left: 0; width: 100%; height: 2px;
      background: linear-gradient(90deg, transparent, var(--neon-cyan), transparent);
    }

    .card-title {
      color: var(--neon-pink);
      font-size: 1.2rem;
      margin-top: 0;
      margin-bottom: 20px;
      font-weight: bold;
      letter-spacing: 1.5px;
      text-shadow:
        0 0 5px var(--neon-pink),
        0 0 15px rgba(255, 0, 85, 0.6);
      display: flex;
      align-items: center;
      gap: 8px;
    }

    /* サイバーネオンボタン */
    .btn-neon {
      background: transparent;
      color: var(--neon-green);
      border: 2px solid var(--neon-green);
      padding: 12px 24px;
      border-radius: 8px;
      font-weight: bold;
      font-size: 1rem;
      cursor: pointer;
      letter-spacing: 1px;
      text-shadow: 0 0 8px var(--neon-green);
      box-shadow:
        0 0 10px rgba(0, 255, 102, 0.3),
        inset 0 0 10px rgba(0, 255, 102, 0.1);
      transition: all 0.2s ease;
    }

    .btn-neon:hover {
      background: var(--neon-green);
      color: #000;
      text-shadow: none;
      box-shadow:
        0 0 20px var(--neon-green),
        0 0 40px var(--neon-green);
    }

    .btn-secondary {
      background: transparent;
      color: var(--text-dim);
      border: 1px solid var(--border-color);
      padding: 10px 20px;
      border-radius: 8px;
      cursor: pointer;
      font-weight: bold;
      transition: all 0.2s ease;
    }

    .btn-secondary:hover {
      color: #fff;
      border-color: #fff;
    }

    /* スコア入力グリッド */
    .grid-inputs {
      display: grid;
      grid-template-columns: repeat(2, 1fr);
      gap: 16px;
      margin-bottom: 24px;
    }

    @media (min-width: 600px) {
      .grid-inputs { grid-template-columns: repeat(4, 1fr); }
    }

    .input-box {
      background: var(--panel-bg);
      border: 1px solid var(--border-color);
      border-radius: 10px;
      padding: 16px;
      text-align: center;
      transition: all 0.3s ease;
    }

    .input-box:focus-within {
      border-color: var(--neon-cyan);
      box-shadow: 0 0 15px rgba(0, 243, 255, 0.3);
    }

    .input-box label {
      display: block;
      color: var(--neon-cyan);
      font-weight: bold;
      margin-bottom: 10px;
      text-shadow: 0 0 6px rgba(0, 243, 255, 0.5);
    }

    .input-box input {
      width: 100%;
      background: var(--bg-color);
      border: 1px solid var(--border-color);
      color: #fff;
      padding: 10px;
      border-radius: 6px;
      text-align: center;
      font-size: 1.2rem;
      font-weight: bold;
      outline: none;
      box-shadow: inset 0 0 8px rgba(0, 0, 0, 0.8);
    }

    .input-box input:focus {
      border-color: var(--neon-cyan);
    }

    /* 発光ネオンテーブル */
    .table-container {
      overflow-x: auto;
      border-radius: 8px;
      border: 1px solid var(--border-color);
    }

    table {
      width: 100%;
      border-collapse: collapse;
      text-align: center;
    }

    th, td {
      padding: 14px 10px;
      border-bottom: 1px solid var(--border-color);
      font-size: 0.95rem;
    }

    th {
      background: var(--panel-bg);
      color: var(--neon-cyan);
      text-shadow: 0 0 6px rgba(0, 243, 255, 0.5);
      font-weight: bold;
    }

    td {
      background: var(--card-bg);
    }

    .score-plus {
      color: var(--neon-cyan);
      text-shadow: 0 0 6px rgba(0, 243, 255, 0.4);
    }

    .score-minus {
      color: var(--neon-pink);
      text-shadow: 0 0 6px rgba(255, 0, 85, 0.4);
    }

    .score-rest {
      color: var(--text-dim);
      font-style: italic;
    }

    .row-total {
      background: #0f221c !important;
      color: var(--neon-green);
      font-weight: bold;
      font-size: 1.05rem;
    }

    .row-total td {
      background: #0f221c !important;
      text-shadow: 0 0 8px var(--neon-green);
      border-top: 2px solid var(--neon-green);
    }

    .row-rank {
      background: #26210b !important;
      color: var(--neon-yellow);
      font-weight: bold;
    }

    .row-rank td {
      background: #26210b !important;
      text-shadow: 0 0 8px var(--neon-yellow);
    }

    /* ネオンモーダル (抜け番・4人選択) */
    .modal-overlay {
      position: fixed;
      top: 0; left: 0; width: 100%; height: 100%;
      background: rgba(3, 5, 8, 0.85);
      backdrop-filter: blur(5px);
      display: flex; justify-content: center; align-items: center;
      z-index: 1000;
      visibility: hidden; opacity: 0;
      transition: all 0.3s ease;
    }

    .modal-overlay.active {
      visibility: visible; opacity: 1;
    }

    .modal {
      background: var(--card-bg);
      border: 2px solid var(--neon-pink);
      box-shadow:
        0 0 30px rgba(255, 0, 85, 0.4),
        inset 0 0 15px rgba(255, 0, 85, 0.1);
      border-radius: 14px;
      padding: 28px;
      width: 90%; max-width: 420px;
    }

    .player-select-group {
      display: flex;
      flex-direction: column;
      gap: 12px;
      margin: 20px 0;
    }

    .player-select-label {
      display: flex;
      align-items: center;
      background: var(--panel-bg);
      padding: 12px 16px;
      border-radius: 8px;
      border: 1px solid var(--border-color);
      cursor: pointer;
      transition: all 0.2s ease;
    }

    .player-select-label:hover {
      border-color: var(--neon-pink);
    }

    .player-select-label input {
      margin-right: 14px;
      accent-color: var(--neon-pink);
      transform: scale(1.4);
    }

    .player-select-label span {
      font-weight: bold;
      letter-spacing: 1px;
    }
  </style>
</head>
<body>

  <div class="app-container">
    <header>
      <h1>Cyber Neon Score Manager</h1>
    </header>

    <!-- タブメニュー -->
    <div class="tab-menu">
      <button class="tab-btn active" onclick="switchTab(event, 'game')">対局管理</button>
      <button class="tab-btn" onclick="switchTab(event, 'stats')">成績・推移 (5人)</button>
      <button class="tab-btn" onclick="switchTab(event, 'settings')">メンバー設定</button>
    </div>

    <!-- TAB 1: 対局管理 -->
    <div id="tab-game" class="tab-content active">
      <!-- 待機状態 -->
      <div id="startSection" class="card" style="text-align: center; padding: 50px 20px;">
        <button class="btn-neon" style="font-size: 1.15rem; padding: 16px 32px;" onclick="openPlayerSelect()">
          + 新しい半荘を開始 (4名選択)
        </button>
      </div>

      <!-- スコア入力状態（4人のみ入力） -->
      <div id="inputSection" class="card" style="display: none;">
        <div class="card-title" id="roundTitle">第 1 半荘 スコア入力</div>
        <p style="color: var(--text-dim); font-size: 0.9rem; margin-bottom: 20px;">
          対局参加メンバー4名のスコアを入力してください：
        </p>
        <div class="grid-inputs" id="scoreInputs"></div>
        <div style="display: flex; justify-content: flex-end; gap: 12px;">
          <button class="btn-secondary" onclick="cancelGame()">キャンセル</button>
          <button class="btn-neon" onclick="submitScore()">スコア確定</button>
        </div>
      </div>
    </div>

    <!-- TAB 2: 全体成績・推移 -->
    <div id="tab-stats" class="tab-content">
      <div class="card">
        <div class="card-title">総合スコア推移＆順位表（5名全員）</div>
        <div class="table-container">
          <table>
            <thead>
              <tr id="tableHeader"></tr>
            </thead>
            <tbody id="tableBody"></tbody>
          </table>
        </div>
      </div>
    </div>

    <!-- TAB 3: メンバー設定 -->
    <div id="tab-settings" class="tab-content">
      <div class="card">
        <div class="card-title">プレイヤー登録 (5名)</div>
        <div style="display: flex; flex-direction: column; gap: 14px; margin-bottom: 24px;">
          <input type="text" id="settingP0" class="input-box" style="text-align: left;" placeholder="プレイヤー1">
          <input type="text" id="settingP1" class="input-box" style="text-align: left;" placeholder="プレイヤー2">
          <input type="text" id="settingP2" class="input-box" style="text-align: left;" placeholder="プレイヤー3">
          <input type="text" id="settingP3" class="input-box" style="text-align: left;" placeholder="プレイヤー4">
          <input type="text" id="settingP4" class="input-box" style="text-align: left;" placeholder="プレイヤー5">
        </div>
        <button class="btn-neon" onclick="saveSettings()">名前を保存</button>
      </div>
    </div>
  </div>

  <!-- 対局メンバー（4人選択・1人抜け番）モーダル -->
  <div class="modal-overlay" id="selectModal">
    <div class="modal">
      <div class="card-title" style="color: var(--neon-cyan); text-shadow: 0 0 10px var(--neon-cyan);">
        対局メンバー選択
      </div>
      <p style="font-size: 0.88rem; color: var(--text-dim); line-height: 1.4;">
        今回対局する <b style="color: #fff;">4名</b> を選択してください。<br>
        （チェック無しの1名が「抜け番（休）」になります）
      </p>
      <div class="player-select-group" id="playerSelectList"></div>
      <div style="display: flex; justify-content: flex-end; gap: 12px; margin-top: 20px;">
        <button class="btn-secondary" onclick="closeModal()">キャンセル</button>
        <button class="btn-neon" onclick="confirmActivePlayers()">対局開始</button>
      </div>
    </div>
  </div>

  <script>
    let players = ["プレイヤーA", "プレイヤーB", "プレイヤーC", "プレイヤーD", "プレイヤーE"];
    let history = []; // 各半荘の結果: [ [s1, s2, s3, s4, s5], ... ] (抜け番は "休")
    let currentActiveIndices = []; 

    window.onload = function() {
      loadSettingsToForm();
      renderTable();
    };

    /* タブ切り替え */
    function switchTab(e, tabName) {
      document.querySelectorAll('.tab-btn').forEach(btn => btn.classList.remove('active'));
      document.querySelectorAll('.tab-content').forEach(content => content.classList.remove('active'));

      e.currentTarget.classList.add('active');
      document.getElementById(`tab-${tabName}`).classList.add('active');
    }

    /* モーダル＆抜け番設定 */
    function openPlayerSelect() {
      const list = document.getElementById("playerSelectList");
      list.innerHTML = "";

      players.forEach((p, idx) => {
        list.innerHTML += `
          <label class="player-select-label">
            <input type="checkbox" name="selectPlayer" value="${idx}" checked onchange="limit4(this)">
            <span>${p}</span>
          </label>
        `;
      });
      document.getElementById("selectModal").classList.add("active");
    }

    function closeModal() {
      document.getElementById("selectModal").classList.remove("active");
    }

    function limit4(el) {
      const checked = document.querySelectorAll('input[name="selectPlayer"]:checked');
      if (checked.length > 4) {
        el.checked = false;
        alert("対局に参加できるのは4名までです。");
      }
    }

    function confirmActivePlayers() {
      const checked = Array.from(document.querySelectorAll('input[name="selectPlayer"]:checked'));
      if (checked.length !== 4) {
        alert("対局する4名を選択してください（1名は抜け番）。");
        return;
      }

      currentActiveIndices = checked.map(c => parseInt(c.value));
      closeModal();
      showScoreInputs();
    }

    /* スコア入力表示 */
    function showScoreInputs() {
      document.getElementById("startSection").style.display = "none";
      document.getElementById("inputSection").style.display = "block";
      document.getElementById("roundTitle").textContent = `第 ${history.length + 1} 半荘 スコア入力`;

      const container = document.getElementById("scoreInputs");
      container.innerHTML = "";

      currentActiveIndices.forEach(idx => {
        container.innerHTML += `
          <div class="input-box">
            <label>${players[idx]}</label>
            <input type="number" step="0.1" id="score_${idx}" placeholder="0.0">
          </div>
        `;
      });
    }

    function cancelGame() {
      document.getElementById("inputSection").style.display = "none";
      document.getElementById("startSection").style.display = "block";
      currentActiveIndices = [];
    }

    /* スコア確定 */
    function submitScore() {
      let gameResult = ["休", "休", "休", "休", "休"];

      for (let idx of currentActiveIndices) {
        const val = parseFloat(document.getElementById(`score_${idx}`).value);
        if (isNaN(val)) {
          alert("対局参加者4名全員のスコアを入力してください。");
          return;
        }
        gameResult[idx] = val;
      }

      history.push(gameResult);
      cancelGame();
      renderTable();
      
      // 結果確認用に成績タブへ移動
      document.querySelectorAll('.tab-btn')[1].click();
    }

    /* テーブル描画 (ネオンカラー適用) */
    function renderTable() {
      const header = document.getElementById("tableHeader");
      header.innerHTML = "<th>半荘</th>" + players.map(p => `<th>${p}</th>`).join("");

      const body = document.getElementById("tableBody");
      body.innerHTML = "";

      let totals = [0, 0, 0, 0, 0];

      history.forEach((game, gIdx) => {
        let row = `<tr><td>第 ${gIdx + 1} 半荘</td>`;
        for (let i = 0; i < 5; i++) {
          if (game[i] === "休") {
            row += `<td class="score-rest">休</td>`;
          } else {
            totals[i] += game[i];
            const cls = game[i] > 0 ? "score-plus" : (game[i] < 0 ? "score-minus" : "");
            const scoreStr = game[i] > 0 ? `+${game[i]}` : game[i];
            row += `<td class="${cls}">${scoreStr}</td>`;
          }
        }
        row += "</tr>";
        body.innerHTML += row;
      });

      // トータル行
      let totalRow = `<tr class="row-total"><td>トータル</td>`;
      for (let i = 0; i < 5; i++) {
        const t = totals[i].toFixed(1);
        const tStr = parseFloat(t) > 0 ? `+${t}` : t;
        totalRow += `<td>${tStr}</td>`;
      }
      totalRow += "</tr>";

      // 順位行
      const ranks = getRanks(totals);
      let rankRow = `<tr class="row-rank"><td>総合順位</td>`;
      for (let i = 0; i < 5; i++) {
        rankRow += `<td>${ranks[i]} 位</td>`;
      }
      rankRow += "</tr>";

      body.innerHTML += totalRow + rankRow;
    }

    function getRanks(totals) {
      let sorted = [...totals].sort((a, b) => b - a);
      return totals.map(v => sorted.indexOf(v) + 1);
    }

    /* 設定管理 */
    function loadSettingsToForm() {
      for (let i = 0; i < 5; i++) {
        document.getElementById(`settingP${i}`).value = players[i];
      }
    }

    function saveSettings() {
      for (let i = 0; i < 5; i++) {
        const val = document.getElementById(`settingP${i}`).value.trim();
        players[i] = val || `プレイヤー${i+1}`;
      }
      renderTable();
      alert("メンバー名を変更しました。");
    }
  </script>
</body>
</html>
